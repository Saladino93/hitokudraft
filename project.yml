name: HitokuDraft
options:
  bundleIdPrefix: com.hitokudraft
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    revision: 843250b
  HitokuInference:
    path: HitokuInference
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    revision: 6bb84aa
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    minorVersion: 0.30.6
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  mlx-audio-swift:
    url: https://github.com/Blaizzy/mlx-audio-swift
    from: 0.1.0
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.8.1
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.18.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.0.0
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    from: 1.7.0

schemes:
  HitokuDraft:
    build:
      targets:
        HitokuDraft: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  HitokuDraft:
    type: application
    platform: macOS
    sources:
      - path: VoiceEditor
        excludes:
          - Info.plist
          - VoiceEditor.entitlements
      - path: ACKNOWLEDGMENTS.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitokudraft.app
        PRODUCT_NAME: Hitoku Draft
        MARKETING_VERSION: "1.6.1"
        CURRENT_PROJECT_VERSION: "22"
        INFOPLIST_FILE: VoiceEditor/Info.plist
        CODE_SIGN_ENTITLEMENTS: VoiceEditor/VoiceEditor.entitlements
        CODE_SIGN_STYLE: Automatic
        EXCLUDED_ARCHS: x86_64
        ENABLE_HARDENED_RUNTIME: "YES"
        DEVELOPMENT_TEAM: R4S8W6UC7K
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        DEAD_CODE_STRIPPING: "YES"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-Osize"
          COPY_PHASE_STRIP: "YES"
          DEPLOYMENT_POSTPROCESSING: "YES"
          STRIP_INSTALLED_PRODUCT: "YES"
          STRIP_STYLE: all
          GCC_OPTIMIZATION_LEVEL: s
    dependencies:
      - package: FluidAudio
      - package: HitokuInference
        product: HitokuInference
      - package: HitokuInference
        product: MLXBackend
      - package: HitokuInference
        product: LiteRTBackend
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXVLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift
        product: MLX
      - package: KeyboardShortcuts
      - package: mlx-audio-swift
        product: MLXAudio
      - package: swift-huggingface
        product: HuggingFace
      - package: WhisperKit
        product: WhisperKit
      - package: Sparkle
        product: Sparkle
      - package: SwiftMath
        product: SwiftMath
    postBuildScripts:
      - script: |
          # Embed LiteRT dylibs into the app bundle for runtime dlopen loading.
          LITERT_LIBS="${SRCROOT}/HitokuInference/Libraries/macos_arm64"
          LITERT_PREBUILT="${SRCROOT}/../litert-lm/prebuilt/macos_arm64"
          FRAMEWORKS_DIR="${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          MACOS_DIR="${BUILT_PRODUCTS_DIR}/${EXECUTABLE_FOLDER_PATH}"
          mkdir -p "${FRAMEWORKS_DIR}"
          # Copy engine + runtime dylibs to Frameworks/
          for lib in liblitert_lm_engine.dylib libLiteRt.dylib libGemmaModelConstraintProvider.dylib; do
            if [ -f "${LITERT_LIBS}/${lib}" ]; then
              cp -f "${LITERT_LIBS}/${lib}" "${FRAMEWORKS_DIR}/"
              codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "${FRAMEWORKS_DIR}/${lib}" 2>/dev/null || true
            fi
          done
          # GPU accelerator dylibs must be next to the executable (LiteRT dlopen uses bare filename)
          for lib in libLiteRtMetalAccelerator.dylib libLiteRtWebGpuAccelerator.dylib libLiteRtTopKWebGpuSampler.dylib; do
            SRC="${LITERT_LIBS}/${lib}"
            [ ! -f "${SRC}" ] && SRC="${LITERT_PREBUILT}/${lib}"
            if [ -f "${SRC}" ]; then
              cp -f "${SRC}" "${MACOS_DIR}/"
              codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "${MACOS_DIR}/${lib}" 2>/dev/null || true
            fi
          done
          # Copy licensing.json into Resources if it exists (commercial builds only)
          if [ -f "${SRCROOT}/licensing.json" ]; then
            cp -f "${SRCROOT}/licensing.json" "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/licensing.json"
          fi
        name: Embed LiteRT Dylibs
