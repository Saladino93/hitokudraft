name: HitokuDraft
options:
  bundleIdPrefix: com.hitokudraft
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    revision: 843250b
  HitokuInference:
    path: HitokuInference
  LiteRT-LM:
    url: https://github.com/google-ai-edge/LiteRT-LM
    # Pinned by revision (v0.13.1 tag commit): the LiteRTLM target uses
    # .unsafeFlags(-all_load), which SwiftPM disallows for versioned deps.
    revision: a0afb5a56acd106b23a2b2385b8469834dc268c0
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    revision: 6bb84aa
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    minorVersion: 0.30.6
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  mlx-audio-swift:
    url: https://github.com/Blaizzy/mlx-audio-swift
    from: 0.1.0
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.8.1
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.18.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.0.0
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    from: 1.7.0

schemes:
  HitokuDraft:
    build:
      targets:
        HitokuDraft: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  HitokuDraft:
    type: application
    platform: macOS
    sources:
      - path: VoiceEditor
        excludes:
          - Info.plist
          - VoiceEditor.entitlements
      - path: ACKNOWLEDGMENTS.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitokudraft.app
        PRODUCT_NAME: Hitoku Draft
        MARKETING_VERSION: "1.6.6"
        CURRENT_PROJECT_VERSION: "27"
        INFOPLIST_FILE: VoiceEditor/Info.plist
        CODE_SIGN_ENTITLEMENTS: VoiceEditor/VoiceEditor.entitlements
        CODE_SIGN_STYLE: Automatic
        EXCLUDED_ARCHS: x86_64
        ENABLE_HARDENED_RUNTIME: "YES"
        DEVELOPMENT_TEAM: R4S8W6UC7K
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        DEAD_CODE_STRIPPING: "YES"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-Osize"
          COPY_PHASE_STRIP: "YES"
          DEPLOYMENT_POSTPROCESSING: "YES"
          STRIP_INSTALLED_PRODUCT: "YES"
          STRIP_STYLE: all
          GCC_OPTIMIZATION_LEVEL: s
    dependencies:
      - package: FluidAudio
      - package: HitokuInference
        product: HitokuInference
      - package: HitokuInference
        product: MLXBackend
      - package: HitokuInference
        product: LiteRTBackend
      - package: LiteRT-LM
        product: LiteRTLM
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXVLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift
        product: MLX
      - package: KeyboardShortcuts
      - package: mlx-audio-swift
        product: MLXAudio
      - package: swift-huggingface
        product: HuggingFace
      - package: WhisperKit
        product: WhisperKit
      - package: Sparkle
        product: Sparkle
      - package: SwiftMath
        product: SwiftMath
    postBuildScripts:
      # LiteRT dylibs are no longer embedded by hand — the official SDK's
      # CLiteRTLM_mac.xcframework is linked + embedded by SwiftPM/Xcode.
      - script: |
          # Copy licensing.json into Resources if it exists (commercial builds only)
          if [ -f "${SRCROOT}/licensing.json" ]; then
            cp -f "${SRCROOT}/licensing.json" "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/licensing.json"
          fi
        name: Copy Licensing
