<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <!-- 
    Hitoku (秘匿) Menu Bar Icon — Template
    Use as NSImage with template=true for automatic macOS menu bar tinting.
    Pure black (#000000) shapes — macOS handles light/dark adaptation.
  -->
  
  <g fill="none" stroke="#000000" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Book cover -->
    <path d="M5.5 3 Q5.5 2 6.5 2 L14.5 2 Q15.5 2 15.5 3 L15.5 15.5 Q15.5 16.5 14.5 16.5 L6.5 16.5 Q5.5 16.5 5.5 15.5 Z"/>
    
    <!-- Spine -->
    <line x1="8" y1="2" x2="8" y2="16.5"/>
    
    <!-- Bottom pages edge -->
    <path d="M6.5 16.5 L6.5 17.8 Q6.5 18.8 7.5 18.8 L15.5 18.8 Q16.5 18.8 16.5 17.8 L16.5 16.5"/>
    
    <!-- Page lines -->
    <line x1="7" y1="17.5" x2="16" y2="17.5" stroke-width="0.5" opacity="0.4"/>
    <line x1="6.8" y1="18.2" x2="16.2" y2="18.2" stroke-width="0.5" opacity="0.3"/>
  </g>
  
  <!-- 秘 kanji -->
  <text 
    x="11.8" 
    y="10" 
    font-family="-apple-system, 'Hiragino Sans', 'Hiragino Kaku Gothic Pro', sans-serif" 
    font-size="7" 
    font-weight="500" 
    fill="#000000" 
    text-anchor="middle" 
    dominant-baseline="central">秘</text>
</svg>
